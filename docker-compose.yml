version: '3.8'

services:
  content-distiller:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FETCH_TIMEOUT_MS=10000
      - MAX_CONTENT_LENGTH_BYTES=5000000
      - USER_AGENT=ArticleExtractorBot/1.0 (+contact@example.com)
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
